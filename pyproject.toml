[project]
name = "cyphnapse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "edilrey", email = "joshedilreydeguzman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cyphnapse = "cyphnapse:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"